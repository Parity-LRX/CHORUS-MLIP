cfg:
  resume_from_model: null
  finetune_from_model: null
  finetune: null
  misc:
    project_name: TECE_MS25_zr-o_C48_Seed20260616
    global_seed: 20260616
    device: cuda
    allow_tf32: false
    ignore_warning: true
    log_level: debug
    env:
      WANDB_MODE: offline
    LossSkipController:
      enable: false
      manual_threshold: 1000000.0
      start_step: 1000
      ema_window: 1000
      multiplier: 1000000.0
      skip_nan: true
      skip_large: true
  trainer:
    _target_: lightning.Trainer
    num_nodes: 1
    accelerator: auto
    devices: auto
    max_time: '90:00:00:00'
    max_epochs: 180
    max_steps: 45000
    min_epochs: 1
    precision: 32
    strategy: auto
    gradient_clip_val: 10.0
    enable_progress_bar: true
    log_every_n_steps: 20
    enable_model_summary: true
    enable_checkpointing: true
    check_val_every_n_epoch: 1
    detect_anomaly: false
    inference_mode: false
    deterministic: false
  callbacks:
    early_stopping:
      _target_: lightning.pytorch.callbacks.EarlyStopping
      verbose: true
      log_rank_zero_only: true
      monitor: val/forces_mae
      patience: 1000
    checkpoint_epoch:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: checkpoints_epoch
      filename: TECE-{epoch:03d}-{step}
      monitor: val/forces_mae
      save_top_k: -1
      save_last: true
      every_n_epochs: 1
      mode: min
      save_weights_only: false
      auto_insert_metric_name: false
      verbose: false
  dataset:
    type: ase
    split_seed: 20260616
    train_file: /home/ylzhang/chorus_data/ms25_20260818/prepared/zr-o/set1/extxyz/train.extxyz
    valid_file: /home/ylzhang/chorus_data/ms25_20260818/prepared/zr-o/set1/extxyz/val.extxyz
    valid_ratio: 0.1
    valid_from_index: false
    no_valid_set: false
    neighborlist_backend: matscipy
    storage_mode: memory
    shard_dirs:
    - graphCache
    shard_size: 100000
    cache_size: 1024
    avg_graph_size_in_KB: 200
    lmdb_wait_timeout: 86400
    force_dtype: null
    keys:
      fidelity_idx_key: fidelity_idx
      energy_key: energy
      forces_key: forces
      stress_key: stress
      virials_key: virials
      charges_key: charges
      total_charge_key: total_charge
      direct_forces_key: forces
      direct_stress_key: stress
      direct_virials_key: virials
      polarization_key: polarization
      direct_dipole_key: dipole
      conservative_dipole_key: dipole
      direct_polarizability_key: polarizability
      conservative_polarizability_key: polarizability
      born_effective_charges_key: born_effective_charges
      electric_field_key: electric_field
      magnetic_field_key: magnetic_field
      initial_collinear_magmoms_key: initial_collinear_magmoms
      initial_noncollinear_magmoms_key: initial_noncollinear_magmoms
