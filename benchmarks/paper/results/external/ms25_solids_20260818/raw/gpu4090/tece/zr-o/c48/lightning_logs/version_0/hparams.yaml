      total_noncollinear_magmoms_key: total_noncollinear_magmoms
      collinear_magnetic_forces_key: collinear_magnetic_forces
      noncollinear_magnetic_forces_key: noncollinear_magnetic_forces
    train_dataloader:
      _target_: torch_geometric.loader.DataLoader
      batch_size: 4
      shuffle: true
      drop_last: false
      num_workers: 0
    valid_dataloader:
      _target_: torch_geometric.loader.DataLoader
      batch_size: 4
      shuffle: false
      drop_last: false
      num_workers: 0
    test_dataloader:
      _target_: torch_geometric.loader.DataLoader
      batch_size: 4
      shuffle: false
      drop_last: false
      num_workers: 0
  optimizer:
    _target_: torch.optim.AdamW
    lr: 0.001
    weight_decay: 5.0e-07
    amsgrad: true
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: 45000
    eta_min: 1.0e-06
    extra:
      interval: step
      frequency: 1
  synth_metric:
    monitor_metric_name: val/forces_mae
    val/energy_mae: 1.0
    val/energy_per_atom_mae: 5.0
    val/forces_mae: 5.0
    val/energy_per_atom_rmse: 1.0
    val/forces_rmse: 1.0
